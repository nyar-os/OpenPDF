[workspace]
resolver = "2"
members = ["projects/sub_projects", "projects/crates/*"]
default-members = ["projects/crates/napi"]
exclude = ["projects/packages"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
authors = ["OpenPDF Authors"]
repository = "https://github.com/nyar-os/OpenPDF"

[workspace.dependencies]
# Shared host facade for the Node-API surface. Cross-repo git dependencies pin
# the full 40-character revision so local builds and CI resolve the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }
data-compression = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26", default-features = false, features = ["deflate"] }
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26", default-features = false }
media-codec = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
panic = "abort"
