[workspace]
resolver = "2"
members = ["projects/sub_projects", "projects/crates/*"]
default-members = ["projects/crates/napi"]
exclude = ["projects/packages"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
authors = ["OpenPDF Authors"]
repository = "https://github.com/nyar-os/OpenPDF"

[workspace.dependencies]
# Shared host facade for the Node-API surface. Cross-repo git dependencies pin
# the full 40-character revision so local builds and CI resolve the same commit.
wae = { git = "https://github.com/doki-land/wae-framework.git", rev = "f92f818fde7174154d77a87b55a5e44b367034c9", default-features = false, features = ["webview"] }
document-pdf = { git = "https://github.com/oovm/rust-boost", rev = "2246d76b9ec083f738e784e8af6ec0182f90b33f", default-features = false }
data-binary-pdf = { git = "https://github.com/oovm/rust-boost", rev = "2246d76b9ec083f738e784e8af6ec0182f90b33f", default-features = false }
data-compression = { git = "https://github.com/oovm/rust-boost", rev = "2246d76b9ec083f738e784e8af6ec0182f90b33f", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
panic = "abort"
